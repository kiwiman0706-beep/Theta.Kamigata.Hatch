<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>くるりヘア・髪型の記録</title><style>
*{box-sizing:border-box}body{margin:0;background:#f9f7fd;color:#302b40;font-family:system-ui,sans-serif}main{max-width:620px;margin:auto;padding:24px 20px}h1{font-size:22px;margin:0 0 7px}p{font-size:13px;color:#888295;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.stage{position:relative;height:60vh;min-height:280px;max-height:650px;overflow:hidden;border-radius:25px;background:#eee9f6;touch-action:none}.stage img{width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}.badge{position:absolute;top:14px;left:14px;padding:8px 12px;border-radius:25px;background:#ffffffdf;color:#74638b;font-size:12px}.controls{display:flex;gap:8px;margin:14px 0;align-items:center}button{font:inherit;cursor:pointer;min-height:43px;background:white;border:1px solid #e3dbee;border-radius:13px;color:#74638b;padding:9px 14px}.controls button{flex:1}.active{background:#e8e0f7;border-color:#a897cf}button:disabled{opacity:.4}.thumbs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.thumbs button{width:60px;flex:0 0 60px;padding:3px}.thumbs img{width:52px;height:64px;object-fit:cover;border-radius:9px}.small{font-size:11px}footer{font-size:11px;color:#a095b0;text-align:center;margin:25px 0}.zoom{position:absolute;right:12px;top:12px}
</style></head><body><main><h1 id="title"></h1><p id="date"></p><div class="stage" id="stage"><img id="photo" alt="髪型の写真"><div class="badge" id="angle"></div><button class="zoom" id="zoom">拡大</button></div><div class="controls"><button id="prev">←</button><button id="play">▶ 自動で回す</button><button id="next">→</button></div><div class="controls" id="rows"></div><div class="thumbs" id="thumbs"></div><p class="small">左右にドラッグすると周囲、上下にドラッグすると高さが変わります。<br>拡大中のドラッグは写真を移動します。</p><p id="note"></p><footer>くるりヘアで残した、ぐるっとした思い出。</footer></main><script>
'use strict';const record=__PAYLOAD__;
const cols=record.plan==='smooth'?12:8,rows=record.plan==='easy'?1:2;const dirs8=['正面','右ななめ前','右側','右ななめ後ろ','後ろ','左ななめ後ろ','左側','左ななめ前'],dirs12=['正面','右前30°','右前60°','右側','右後ろ120°','右後ろ150°','後ろ','左後ろ150°','左後ろ120°','左側','左前60°','左前30°'];
const dirs=cols===12?dirs12:dirs8;const all=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(record.frames[`r${r}_a${c}`])all.push({key:`r${r}_a${c}`,row:r,col:c,label:dirs[c]+(r?'・斜め上':'')});if(record.frames.top)all.push({key:'top',row:rows,col:0,label:'真上（つむじ）'});
let at=all[0],timer=null,zoom=1,panX=0,panY=0,remember=0;const el=id=>document.getElementById(id);
el('title').textContent=record.title;el('date').textContent=record.child+' · '+record.date;el('note').textContent=record.note;const photo=el('photo');
function apply(){const a=record.frames[at.key].align||{};photo.style.transform=`translate(${(a.x||0)+panX}%,${(a.y||0)+panY}%) scale(${(a.scale||1)*zoom}) rotate(${a.rotation||0}deg)`;el('zoom').textContent=zoom===1?'拡大':'戻す';}
function show(s){if(!s)return;at=s;if(s.key!=='top')remember=s.col;zoom=1;panX=panY=0;photo.src=record.frames[s.key].image;photo.alt=s.label;el('angle').textContent=s.label;apply();el('rows').textContent='';for(let r=0;r<=rows;r++){const b=document.createElement('button');b.textContent=r===rows?'真上':r?'斜め上':'頭の高さ';b.className=r===s.row?'active':'';b.disabled=!all.some(x=>x.row===r);b.onclick=()=>{stop();verticalTo(r);};el('rows').appendChild(b);}el('thumbs').textContent='';for(const v of all.filter(x=>x.row===s.row)){const b=document.createElement('button');b.className=v.key===s.key?'active':'';const i=document.createElement('img');i.src=record.frames[v.key].image;i.alt=v.label;b.appendChild(i);b.onclick=()=>{stop();show(v);};el('thumbs').appendChild(b);}}
function horizontal(delta){let row=at.row===rows?0:at.row;const list=all.filter(x=>x.row===row);if(!list.length)return;const pos=list.findIndex(x=>x.key===at.key);show(list[(pos+delta+list.length)%list.length]);}
function verticalTo(r){const list=all.filter(s=>s.row===r).sort((a,b)=>Math.min(Math.abs(a.col-remember),cols-Math.abs(a.col-remember))-Math.min(Math.abs(b.col-remember),cols-Math.abs(b.col-remember)));if(list.length)show(list[0]);}
function vertical(delta){for(let r=at.row+delta;r>=0&&r<=rows;r+=delta)if(all.some(s=>s.row===r)){verticalTo(r);break;}}
function stop(){if(timer)clearInterval(timer);timer=null;el('play').textContent='▶ 自動で回す';}
el('prev').onclick=()=>{stop();horizontal(-1);};el('next').onclick=()=>{stop();horizontal(1);};el('play').onclick=()=>{if(timer){stop();return;}if(at.row===rows)verticalTo(0);timer=setInterval(()=>horizontal(1),700);el('play').textContent='Ⅱ 停止';};el('zoom').onclick=()=>{stop();zoom=zoom===1?2:1;panX=panY=0;apply();};
let last=null,ax=0,ay=0;el('stage').onpointerdown=e=>{if(e.target.closest('button'))return;stop();el('stage').setPointerCapture(e.pointerId);last={x:e.clientX,y:e.clientY};ax=ay=0;};el('stage').onpointermove=e=>{if(!last)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;last={x:e.clientX,y:e.clientY};if(zoom>1){const box=el('stage').getBoundingClientRect();panX=Math.max(-80,Math.min(80,panX+dx/box.width*100));panY=Math.max(-80,Math.min(80,panY+dy/box.height*100));apply();return;}ax+=dx;ay+=dy;if(Math.abs(ax)>28&&Math.abs(ax)>Math.abs(ay)){horizontal(ax<0?1:-1);ax=ay=0;}else if(Math.abs(ay)>44&&Math.abs(ay)>Math.abs(ax)){vertical(ay<0?1:-1);ax=ay=0;}};el('stage').onpointerup=el('stage').onpointercancel=()=>last=null;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});if(at)show(at);
</script></body></html>
