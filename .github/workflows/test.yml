name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Core tests
        working-directory: project/kururi-hair
        run: node --test tests/core.test.cjs
      - name: Camera geometry checks
        working-directory: project/kururi-hair
        run: bash tests/test-camera.sh
